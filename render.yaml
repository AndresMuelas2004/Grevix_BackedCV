# Render Blueprint: a temporary public demo for the hackathon's feedback round (free plan).
# The OpenAI key is entered in the Render dashboard when the Blueprint is created, never committed.
services:
  - type: web
    name: backedcv
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: PORT # the Dockerfile serves on 8000
        value: "8000"
      - key: FORWARDED_ALLOW_IPS # trust Render's proxy, so the per-client limit sees real clients
        value: "*"
      - key: BACKEDCV_ENV
        value: prod
      - key: BACKEDCV_MODEL_STRONG # the cheap model for every call, to fit the event's API budget
        value: gpt-6-luna
      - key: BACKEDCV_RATE_LIMIT_PER_HOUR
        value: "20"
      - key: BACKEDCV_DAILY_MODEL_RUNS
        value: "150"
      - key: LANGSMITH_TRACING
        value: "false"
