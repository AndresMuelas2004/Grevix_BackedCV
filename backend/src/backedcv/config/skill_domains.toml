# Technologies per skill domain, for rule R3 (tool sprawl). Terms are lowercase and match whole
# words only (domain/keywords.py). A term may sit in more than one domain. Generic tools that
# appear in almost every posting (Python, Git, Jira) are left out on purpose, so they never
# count as a domain by themselves.

[domains.frontend]
name = "frontend"
terms = [
    "react", "reactjs", "react.js", "vue", "vuejs", "vue.js", "angular", "angularjs",
    "svelte", "sveltekit", "next.js", "nextjs", "nuxt", "gatsby", "ember.js",
    "javascript", "typescript", "html", "html5", "css", "css3", "sass", "scss",
    "tailwind", "bootstrap", "redux", "webpack", "vite", "storybook", "jquery",
    "frontend", "front-end", "material ui", "chakra ui", "styled components",
]

[domains.backend]
name = "backend"
