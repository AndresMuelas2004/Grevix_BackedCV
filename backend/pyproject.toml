[project]
name = "backedcv"
version = "0.1.0"
description = "CV vs job posting checker: explainable fit score, knockout warnings and evidence-backed CV edits."
authors = [{ name = "Andres Muelas" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]>=0.143.0",
    "langchain>=1.4.4",
    "langchain-openai>=1.7.0",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langsmith>=0.14.7",
    "lxml>=6.1.3",
    "pdfplumber>=0.11.10",
    "pydantic-settings>=2.15.0",
    "python-docx>=1.2.0",
    "typst>=0.15.0",
]

[build-system]
requires = ["uv_build>=0.11.30,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
